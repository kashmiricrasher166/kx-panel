<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kx — hosts</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<header>
  <h1>kx hosts</h1>
  <button id="refresh">refresh</button>
  <button id="logout">logout</button>
</header>
<div class="grid" id="grid"></div>
<script>
const token = localStorage.getItem('kx_token');
if (!token) location.href = '/login.html';

async function load() {
  const r = await fetch('/api/hosts', {headers: {'x-session': token}});
  if (r.status === 401) return location.href = '/login.html';
  const j = await r.json();
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for (const h of j.hosts) {
    const el = document.createElement('div');
    el.className = 'card host';
    el.innerHTML = `
      <div class="host-top">
        <span class="host-name">${h.host}</span>
        <span class="host-ip">${h.ip}</span>
      </div>
      <div class="meta">user: ${h.user} — ${h.platform} ${h.arch}</div>
      <div class="meta">root: ${h.project_root || '—'}</div>
      <div class="meta">files: ${h.files} — installs: ${h.installs}</div>
      <div class="meta">last: ${new Date(h.last_seen).toLocaleString()}</div>
      <a class="btn" href="/host.html?id=${h.id}">open</a>
    `;
    g.appendChild(el);
  }
}
document.getElementById('refresh').onclick = load;
document.getElementById('logout').onclick = () => {
  localStorage.removeItem('kx_token');
  location.href = '/login.html';
};
load();
</script>
</body></html>
